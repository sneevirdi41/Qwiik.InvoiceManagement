name: Generate Initial EF Core Migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-migration:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies and local tools
        run: |
          dotnet restore Qwiik.InvoiceManagement.slnx
          dotnet tool restore

      - name: Build solution (Release)
        run: dotnet build Qwiik.InvoiceManagement.slnx --configuration Release --no-restore

      - name: Generate InitialCreate EF Core migration
        shell: powershell
        run: |
          $migrationsDir = "Qwiik.InvoiceManagement.Infrastructure/Persistence/Migrations"
          if (Test-Path "$migrationsDir/*.cs") {
            Write-Host "Migrations already exist under $migrationsDir. Skipping generation."
          } else {
            dotnet tool run dotnet-ef migrations add InitialCreate `
              --project Qwiik.InvoiceManagement.Infrastructure `
              --startup-project Qwiik.InvoiceManagement.API `
              --output-dir Persistence/Migrations `
              --configuration Release `
              --no-build
            if ($LASTEXITCODE -ne 0) { throw "dotnet-ef migrations add InitialCreate failed." }
          }

          $migrationFiles = Get-ChildItem -Path $migrationsDir -Filter "*_InitialCreate.cs" -ErrorAction SilentlyContinue
          $designerFiles = Get-ChildItem -Path $migrationsDir -Filter "*_InitialCreate.Designer.cs" -ErrorAction SilentlyContinue
          $snapshotFile = Join-Path $migrationsDir "AppDbContextModelSnapshot.cs"

          if (-not $migrationFiles -or -not $designerFiles -or -not (Test-Path $snapshotFile)) {
            $found = if (Test-Path $migrationsDir) { (Get-ChildItem -Path $migrationsDir | Select-Object -ExpandProperty Name) -join ", " } else { "<directory missing>" }
            throw "Expected InitialCreate migration, designer, and AppDbContextModelSnapshot.cs under $migrationsDir. Found: $found"
          }

          Write-Host "Verified generated migration files under ${migrationsDir}:"
          Get-ChildItem -Path $migrationsDir | ForEach-Object { Write-Host " - $($_.Name)" }

      - name: Rebuild solution with generated migration (Release)
        run: dotnet build Qwiik.InvoiceManagement.slnx --configuration Release --no-restore

      - name: Start SQL Server LocalDB and verify schema
        shell: powershell
        run: |
          $sqllocaldb = (Get-Command sqllocaldb -ErrorAction SilentlyContinue).Source
          if (-not $sqllocaldb) {
            $sqllocaldb = Get-ChildItem "C:\Program Files\Microsoft SQL Server" -Filter "SqlLocalDB.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
            if ($sqllocaldb) {
              $env:PATH = "$(Split-Path $sqllocaldb);$env:PATH"
              "$(Split-Path $sqllocaldb)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }
          if (-not $sqllocaldb) {
            throw "SqlLocalDB.exe was not found on this runner."
          }

          & $sqllocaldb create MSSQLLocalDB -s
          if ($LASTEXITCODE -ne 0) { throw "Failed to create/start MSSQLLocalDB instance." }
          & $sqllocaldb info MSSQLLocalDB

          $connStr = "Server=(localdb)\MSSQLLocalDB;Database=QwiikInvoiceManagementMigrationCheck;Trusted_Connection=True;TrustServerCertificate=True;"
          $env:ConnectionStrings__DefaultConnection = $connStr
          $env:QWIIK_DESIGNTIME_CONNECTION_STRING = $connStr

          $migrationsOutput = (dotnet tool run dotnet-ef migrations list `
            --project Qwiik.InvoiceManagement.Infrastructure `
            --startup-project Qwiik.InvoiceManagement.API `
            --configuration Release `
            --no-build) | Out-String
          if ($LASTEXITCODE -ne 0) { throw "dotnet-ef migrations list failed." }
          Write-Host $migrationsOutput
          if ($migrationsOutput -notmatch 'InitialCreate') {
            throw "InitialCreate was not discovered by 'dotnet-ef migrations list'."
          }

          dotnet tool run dotnet-ef database update `
            --project Qwiik.InvoiceManagement.Infrastructure `
            --startup-project Qwiik.InvoiceManagement.API `
            --configuration Release `
            --no-build
          if ($LASTEXITCODE -ne 0) { throw "dotnet-ef database update failed." }

          $conn = New-Object System.Data.SqlClient.SqlConnection($connStr)
          $conn.Open()
          try {
            $cmd = $conn.CreateCommand()
            $cmd.CommandText = @"
          SELECT
            (SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_NAME IN ('Organizations','Invoices','InvoiceItems','__EFMigrationsHistory')) AS TableCount,
            (SELECT COUNT(*) FROM [__EFMigrationsHistory] WHERE MigrationId LIKE '%_InitialCreate') AS MigrationCount,
            (SELECT COUNT(*) FROM sys.indexes WHERE name IN ('UX_Invoices_OrganizationId_InvoiceNumber','IX_Invoices_OrganizationId_Status','IX_Invoices_OrganizationId_InvoiceDate','IX_InvoiceItems_InvoiceId')) AS IndexCount,
            (SELECT COUNT(*) FROM sys.foreign_keys WHERE parent_object_id IN (OBJECT_ID('dbo.Invoices'), OBJECT_ID('dbo.InvoiceItems'))) AS FkCount,
            (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS WHERE ((TABLE_NAME = 'Invoices' AND COLUMN_NAME IN ('Subtotal','TaxAmount','TotalAmount')) OR (TABLE_NAME = 'InvoiceItems' AND COLUMN_NAME IN ('Quantity','UnitPrice','LineTotal'))) AND NUMERIC_PRECISION = 18 AND NUMERIC_SCALE = 2) AS DecimalColumnCount
          "@
            $reader = $cmd.ExecuteReader()
            if (-not $reader.Read()) { throw "Schema verification query returned no rows." }
            $tableCount = [int]$reader["TableCount"]
            $migrationCount = [int]$reader["MigrationCount"]
            $indexCount = [int]$reader["IndexCount"]
            $fkCount = [int]$reader["FkCount"]
            $decimalCount = [int]$reader["DecimalColumnCount"]
            $reader.Close()

            Write-Host "Verified schema: Tables=$tableCount/4, InitialCreateRows=$migrationCount, Indexes=$indexCount/4, ForeignKeys=$fkCount/2, Decimal18_2Columns=$decimalCount/6"
            if ($tableCount -ne 4) { throw "Expected 4 tables (Organizations, Invoices, InvoiceItems, __EFMigrationsHistory), found $tableCount." }
            if ($migrationCount -lt 1) { throw "Expected InitialCreate entry in __EFMigrationsHistory, found $migrationCount." }
            if ($indexCount -ne 4) { throw "Expected 4 expected indexes, found $indexCount." }
            if ($fkCount -ne 2) { throw "Expected 2 foreign keys, found $fkCount." }
            if ($decimalCount -ne 6) { throw "Expected 6 decimal(18,2) columns, found $decimalCount." }
          }
          finally {
            $conn.Close()
          }

      - name: Run all xUnit tests
        run: dotnet test Qwiik.InvoiceManagement.slnx --configuration Release --no-build --verbosity normal

      - name: Commit and push generated migration
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Qwiik.InvoiceManagement.Infrastructure/Persistence/Migrations
          $staged = git status --porcelain Qwiik.InvoiceManagement.Infrastructure/Persistence/Migrations
          if (-not [string]::IsNullOrWhiteSpace(($staged | Out-String))) {
            git commit -m "Add InitialCreate EF Core 10 migration"
            if ($LASTEXITCODE -ne 0) { throw "git commit failed." }
            git push
            if ($LASTEXITCODE -ne 0) { throw "git push failed." }
          } else {
            Write-Host "No new migration changes to commit."
          }
